<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Cloud Command Deck v2.2</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #050811;
            --bg-grad: radial-gradient(circle at 12% 10%, rgba(0, 240, 255, 0.08), transparent 40%),
                       radial-gradient(circle at 88% 18%, rgba(59, 130, 246, 0.08), transparent 45%);
            --panel: rgba(13, 20, 36, 0.92);
            --panel-solid: #0d1424;
            --border: rgba(148, 163, 184, 0.16);
            --accent: #00f0ff;
            --accent-soft: rgba(0, 240, 255, 0.14);
            --success: #10b981;
            --warn: #f59e0b;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            background-image: var(--bg-grad);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 11px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 10;
        }
        .brand-group { display: flex; align-items: center; gap: 10px; }
        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 1.02rem;
            letter-spacing: 0.7px;
            color: var(--accent);
        }
        .pulse {
            width: 9px;
            height: 9px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success);
            animation: pulseAnim 2s infinite;
        }
        @keyframes pulseAnim {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
        }
        .ver-badge {
            font-size: 0.7rem;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        select, button {
            background: rgba(30, 41, 59, 0.85);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 0.84rem;
            cursor: pointer;
            outline: none;
            transition: all 0.16s ease;
        }
        select:hover, button:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-soft);
        }
        .continue-btn {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.45);
            color: #6ee7b7;
            font-weight: 600;
        }
        .new-chat-btn {
            background: var(--accent-soft);
            border-color: rgba(0, 240, 255, 0.4);
            color: var(--accent);
            font-weight: 600;
        }

        /* Main Shell */
        .app-shell {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        /* Sidebar */
        aside.sidebar {
            width: 265px;
            background: rgba(9, 14, 26, 0.95);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            gap: 12px;
            transition: transform 0.2s ease, width 0.2s ease;
        }
        aside.sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border-right: none;
        }
        .sidebar-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: var(--muted);
            font-weight: 700;
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 9px 10px;
            border-radius: 9px;
            border: 1px solid transparent;
            background: rgba(15, 23, 42, 0.55);
            font-size: 0.82rem;
            cursor: pointer;
        }
        .session-item.active {
            background: var(--accent-soft);
            border-color: rgba(0, 240, 255, 0.4);
            color: var(--accent);
        }
        .session-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-del {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 2px 6px;
            font-size: 0.76rem;
        }
        .session-del:hover { color: #f87171; box-shadow: none; }

        /* Mini Status Dashboard */
        .mini-dash {
            background: var(--panel-solid);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 11px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.76rem;
        }
        .mini-dash-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent);
            font-weight: 700;
        }
        .mini-row {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
        }
        .mini-row span:last-child { color: var(--text); font-weight: 600; }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Telemetry Strip */
        .telemetry-bar {
            background: rgba(8, 13, 24, 0.9);
            border-bottom: 1px solid var(--border);
            padding: 8px 18px;
            display: flex;
            gap: 9px;
            overflow-x: auto;
            align-items: center;
        }
        .device-pill {
            background: var(--panel-solid);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.76rem;
            white-space: nowrap;
        }
        .dot-online { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); }
        .dot-standby { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

        /* Chat Stream */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg {
            max-width: min(860px, 92%);
            padding: 14px 18px;
            border-radius: 15px;
            line-height: 1.7;
            font-size: 0.94rem;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            width: min(860px, 92%);
        }
        .msg-meta {
            font-size: 0.72rem;
            color: var(--accent);
            margin-bottom: 7px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            direction: ltr;
        }

        /* Auto-directional Markdown & Tables */
        .md-content { unicode-bidi: plaintext; }
        .md-content h1, .md-content h2, .md-content h3 { color: #f8fafc; margin: 12px 0 6px; font-weight: 700; }
        .md-content p { margin: 7px 0; }
        .md-content ul, .md-content ol { padding-inline-start: 22px; margin: 7px 0; }
        .md-content li { margin: 3px 0; }
        .md-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.85rem;
            background: rgba(7, 11, 20, 0.75);
        }
        .md-content th, .md-content td {
            border: 1px solid var(--border);
            padding: 8px 11px;
            text-align: start;
        }
        .md-content th { background: rgba(0, 240, 255, 0.08); color: var(--accent); }
        .md-content :not(pre) > code {
            background: rgba(30, 41, 59, 0.9);
            color: #7dd3fc;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.85em;
            direction: ltr;
            unicode-bidi: isolate;
        }

        /* Code Blocks */
        pre {
            direction: ltr;
            text-align: left;
            background: #060911 !important;
            padding: 13px;
            padding-top: 36px;
            border-radius: 11px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid rgba(148, 163, 184, 0.2);
            position: relative;
        }
        pre code { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.86rem; }
        .copy-btn {
            position: absolute;
            top: 7px;
            right: 7px;
            background: rgba(15, 23, 42, 0.95);
            color: var(--accent);
            border: 1px solid rgba(0, 240, 255, 0.35);
            padding: 3px 9px;
            font-size: 0.72rem;
            border-radius: 6px;
        }

        /* Quick Chips */
        .quick-bar {
            padding: 0 20px 9px;
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .chip {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.75rem;
        }
        .chip:hover { color: var(--accent); border-color: var(--accent); }

        /* Composer */
        .input-area {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            padding: 11px 20px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            background: #060a14;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 11px 13px;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            font-size: 0.93rem;
            line-height: 1.5;
            outline: none;
            unicode-bidi: plaintext;
        }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .send-btn {
            background: var(--accent);
            color: #041018;
            font-weight: 700;
            border: none;
            padding: 12px 19px;
            border-radius: 11px;
        }

        @media (max-width: 768px) {
            aside.sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 20;
                box-shadow: 12px 0 30px rgba(0, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>

<header>
    <div class="brand-group">
        <button onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
        <div class="brand">
            <div class="pulse"></div>
            <span>J.A.R.V.I.S. CLOUD</span>
            <span class="ver-badge">v2.2 DECK</span>
        </div>
    </div>
    <div class="controls">
        <select id="model-select" onchange="updateDash()" title="Select AI Routing Mode">
            {% for key, m in models.items() %}
            <option value="{{ key }}">{{ m.name }}</option>
            {% endfor %}
        </select>
        <button class="new-chat-btn" onclick="createNewSession()">➕ New Chat</button>
        <button class="continue-btn" onclick="continueCode()" title="Continue generating if code cut off">⏩ Continue Code</button>
        <button onclick="clearCurrentChat()" title="Clear current session messages">🗑️ Clear</button>
    </div>
</header>

<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Sessions History</div>
        <div class="session-list" id="session-list"></div>

        <div class="mini-dash">
            <div class="mini-dash-head">
                <span>⚡ LIVE SYSTEM DASH</span>
                <button style="padding: 2px 7px; font-size: 0.7rem;" onclick="fetchTelemetry()">Sync</button>
            </div>
            <div class="mini-row"><span>Engine</span><span id="dash-model">Auto-Router</span></div>
            <div class="mini-row"><span>Devices Tracked</span><span id="dash-devices">0</span></div>
            <div class="mini-row"><span>Session Messages</span><span id="dash-msgs">0</span></div>
        </div>
    </aside>

    <div class="workspace">
        <div class="telemetry-bar" id="telemetry-bar">
            <div class="device-pill"><span class="dot-online"></span> Syncing device telemetry...</div>
        </div>

        <div id="chat-box"></div>

        <div class="quick-bar">
            <button class="chip" onclick="sendMessage('اكتبلي سكربت Python ينظف ملف CSV بـ pandas ويرتب الأعمدة')">🧹 Pandas Cleaner</button>
            <button class="chip" onclick="sendMessage('صمملي مخطط FastAPI بسيط مع endpoint للفحص والرسائل')">⚙️ FastAPI Starter</button>
            <button class="chip" onclick="sendMessage('Summarize your capabilities clearly in structured points')">📋 Capabilities</button>
        </div>

        <div class="input-area">
            <textarea id="prompt-input" rows="1" placeholder="Type a command, question, or full project spec... (Enter to send, Shift+Enter for new line)"></textarea>
            <button class="send-btn" onclick="sendMessage()">Send ⚡</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = "jarvis_v22_sessions";
    let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    let activeSessionId = null;
    let deviceCount = 0;

    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt-input");
    const sessionListEl = document.getElementById("session-list");

    if (!sessions || !Array.isArray(sessions) || sessions.length === 0) {
        sessions = [{
            id: "s_" + Date.now(),
            title: "Main Command Session",
            messages: []
        }];
    }
    activeSessionId = sessions[0].id;

    function saveSessions() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
        renderSidebar();
        updateDash();
    }

    function getActiveSession() {
        return sessions.find(s => s.id === activeSessionId) || sessions[0];
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
    }

    function hasArabic(text) {
        return /[\u0600-\u06FF]/.test(text || "");
    }

    function updateDash() {
        const sel = document.getElementById("model-select");
        const activeLabel = sel.options[sel.selectedIndex]?.text || sel.value;
        document.getElementById("dash-model").innerText = activeLabel;
        document.getElementById("dash-devices").innerText = deviceCount;
        document.getElementById("dash-msgs").innerText = getActiveSession().messages.length;
    }

    function renderSidebar() {
        sessionListEl.innerHTML = "";
        sessions.forEach(s => {
            const item = document.createElement("div");
            item.className = `session-item ${s.id === activeSessionId ? "active" : ""}`;
            item.onclick = () => selectSession(s.id);

            const nameSpan = document.createElement("span");
            nameSpan.className = "session-name";
            nameSpan.innerText = s.title || "Untitled Session";

            const delBtn = document.createElement("button");
            delBtn.className = "session-del";
            delBtn.innerText = "✕";
            delBtn.title = "Delete session";
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteSession(s.id);
            };

            item.appendChild(nameSpan);
            if (sessions.length > 1) item.appendChild(delBtn);
            sessionListEl.appendChild(item);
        });
    }

    function selectSession(id) {
        activeSessionId = id;
        renderSidebar();
        renderChat();
        updateDash();
    }

    function createNewSession() {
        const newId = "s_" + Date.now();
        sessions.unshift({
            id: newId,
            title: `Session #${sessions.length + 1}`,
            messages: []
        });
        activeSessionId = newId;
        saveSessions();
        renderChat();
    }

    function deleteSession(id) {
        sessions = sessions.filter(s => s.id !== id);
        if (sessions.length === 0) {
            sessions.push({ id: "s_" + Date.now(), title: "Main Command Session", messages: [] });
        }
        if (activeSessionId === id) activeSessionId = sessions[0].id;
        saveSessions();
        renderChat();
    }

    function clearCurrentChat() {
        const sess = getActiveSession();
        sess.messages = [];
        saveSessions();
        renderChat();
    }

    async function fetchTelemetry() {
        try {
            const res = await fetch("/api/telemetry");
            const data = await res.json();
            const bar = document.getElementById("telemetry-bar");
            bar.innerHTML = "";
            const entries = Object.entries(data || {});
            deviceCount = entries.length;
            for (const [device, info] of entries) {
                const dotClass = info.status === "online" ? "dot-online" : "dot-standby";
                bar.innerHTML += `
                    <div class="device-pill">
                        <span class="${dotClass}"></span>
                        <strong>${device}</strong>
                        <span>🔋 ${info.battery}</span>
                        <span>•</span>
                        <span>📶 ${info.network}</span>
                        <span>•</span>
                        <span>${info.last_seen}</span>
                    </div>`;
            }
            updateDash();
        } catch (e) {}
    }

    function buildMessageElement(role, content, meta = "") {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        const isAr = hasArabic(content);

        if (role === "ai") {
            div.innerHTML = `
                <div class="msg-meta"><span>${meta}</span></div>
                <div class="md-content" dir="${isAr ? "rtl" : "ltr"}" style="text-align: ${isAr ? "right" : "left"};">${marked.parse(content)}</div>
            `;
            div.querySelectorAll("pre").forEach(pre => {
                const codeEl = pre.querySelector("code");
                if (codeEl) hljs.highlightElement(codeEl);
                const btn = document.createElement("button");
                btn.className = "copy-btn";
                btn.innerText = "Copy Code";
                btn.onclick = () => {
                    navigator.clipboard.writeText(codeEl ? codeEl.innerText : pre.innerText);
                    btn.innerText = "Copied ✓";
                    setTimeout(() => btn.innerText = "Copy Code", 1800);
                };
                pre.appendChild(btn);
            });
        } else {
            div.setAttribute("dir", isAr ? "rtl" : "ltr");
            div.style.textAlign = isAr ? "right" : "left";
            div.innerText = content;
        }
        return div;
    }

    function renderChat() {
        chatBox.innerHTML = "";
        const welcome = buildMessageElement(
            "ai",
            "Command deck **v2.2** online. Select a model or keep **Auto-Router** enabled — switch sessions from the sidebar or monitor live devices in the dash.",
            "J.A.R.V.I.S. CORE • READY"
        );
        chatBox.appendChild(welcome);

        const sess = getActiveSession();
        sess.messages.forEach(m => {
            chatBox.appendChild(buildMessageElement(m.role, m.content, m.meta || ""));
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(customText = null) {
        const text = (customText !== null ? customText : promptInput.value).trim();
        if (!text) return;

        if (customText === null) {
            promptInput.value = "";
            promptInput.style.height = "48px";
        }

        const sess = getActiveSession();
        if (sess.messages.length === 0) {
            sess.title = text.slice(0, 32) + (text.length > 32 ? "..." : "");
        }

        sess.messages.push({ role: "user", content: text });
        saveSessions();
        chatBox.appendChild(buildMessageElement("user", text));

        const loadingDiv = buildMessageElement("ai", "⏳ Routing request across cloud models...", "J.A.R.V.I.S. Thinking");
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        const apiHistory = sess.messages
            .slice(0, -1)
            .map(m => ({ role: m.role === "ai" ? "assistant" : m.role, content: m.content }));

        const model = document.getElementById("model-select").value;
        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text, model: model, history: apiHistory })
            });
            const data = await res.json();
            loadingDiv.remove();

            if (data.error) {
                const errText = `❌ ${data.error}`;
                sess.messages.push({ role: "ai", content: errText, meta: "System Alert" });
                saveSessions();
                chatBox.appendChild(buildMessageElement("ai", errText, "System Alert"));
            } else {
                const metaText = `${data.model_used} • ⚡ ${data.latency}`;
                sess.messages.push({ role: "ai", content: data.reply, meta: metaText });
                saveSessions();
                chatBox.appendChild(buildMessageElement("ai", data.reply, metaText));
            }
        } catch (err) {
            loadingDiv.remove();
            const netErr = "❌ Failed to reach server.";
            sess.messages.push({ role: "ai", content: netErr, meta: "Network Error" });
            saveSessions();
            chatBox.appendChild(buildMessageElement("ai", netErr, "Network Error"));
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function continueCode() {
        sendMessage("Continue the code from the exact line you stopped at without repeating what was already written.");
    }

    promptInput.addEventListener("input", () => {
        promptInput.style.height = "48px";
        promptInput.style.height = Math.min(promptInput.scrollHeight, 150) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    renderSidebar();
    renderChat();
    updateDash();
    fetchTelemetry();
    setInterval(fetchTelemetry, 15000);
</script>
</body>
</html>
