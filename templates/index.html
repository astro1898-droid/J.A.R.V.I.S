<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Cloud Neural Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #070b14;
            --panel: #0f172a;
            --border: #1e293b;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Bar */
        header {
            background: var(--panel); border-bottom: 1px solid var(--border);
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
        .pulse { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, button {
            background: #1e293b; color: var(--text); border: 1px solid #334155;
            padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; outline: none;
        }
        select:focus, button:hover { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

        /* Devices Bar */
        .telemetry-bar {
            background: #0b1120; border-bottom: 1px solid var(--border);
            padding: 8px 20px; display: flex; gap: 15px; overflow-x: auto; font-size: 0.8rem;
        }
        .device-pill {
            background: var(--panel); border: 1px solid var(--border); padding: 4px 12px;
            border-radius: 20px; display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .dot-online { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }
        .dot-standby { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }

        /* Chat Area */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 85%; padding: 14px 18px; border-radius: 14px; line-height: 1.6; font-size: 0.95rem; position: relative; }
        .msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 2px; width: 85%; }
        .msg-meta { font-size: 0.75rem; color: var(--accent); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 12px; }

        /* Code blocks */
        pre { direction: ltr; text-align: left; background: #090d16 !important; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid #1e293b; position: relative; }
        code { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.88rem; }
        .copy-btn {
            position: absolute; top: 8px; right: 8px; background: #1e293b; color: var(--accent);
            border: 1px solid var(--accent); padding: 3px 8px; font-size: 0.75rem; border-radius: 5px;
        }

        /* Input Area */
        .input-area {
            background: var(--panel); border-top: 1px solid var(--border);
            padding: 12px 20px; display: flex; gap: 10px; align-items: flex-end;
        }
        textarea {
            flex: 1; background: #070b14; color: var(--text); border: 1px solid #334155;
            border-radius: 10px; padding: 12px; resize: none; height: 52px; max-height: 150px;
            font-size: 0.95rem; outline: none;
        }
        textarea:focus { border-color: var(--accent); }
        .send-btn { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 14px 20px; }
        .continue-btn { background: #10b981; color: #000; font-weight: bold; border: none; }
    </style>
</head>
<body>

<header>
    <div class="brand"><div class="pulse"></div> J.A.R.V.I.S. CLOUD v2.0</div>
    <div class="controls">
        <select id="model-select">
            {% for key, m in models.items() %}
            <option value="{{ key }}">{{ m.name }}</option>
            {% endfor %}
        </select>
        <button class="continue-btn" onclick="continueCode()" title="Continue generating if code cut off">⏩ Continue Code</button>
        <button onclick="clearChat()">🗑️ Clear</button>
    </div>
</header>

<div class="telemetry-bar" id="telemetry-bar">
    <div class="device-pill"><span class="dot-online"></span> Loading device status...</div>
</div>

<div id="chat-box">
    <div class="msg ai">
        <div class="msg-meta"><span>J.A.R.V.I.S. System</span><span>Online</span></div>
        Welcome back! Cloud server is online and ready. Pick a model above (or keep <b>Auto-Router</b>) and tell me what we're building.
    </div>
</div>

<div class="input-area">
    <textarea id="prompt-input" placeholder="Type your command or request a full project... (Shift+Enter for new line)"></textarea>
    <button class="send-btn" onclick="sendMessage()">Send ⚡</button>
</div>

<script>
    let chatHistory = [];
    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt-input");

    async function fetchTelemetry() {
        try {
            const res = await fetch("/api/telemetry");
            const data = await res.json();
            const bar = document.getElementById("telemetry-bar");
            bar.innerHTML = "";
            for (const [device, info] of Object.entries(data)) {
                const dotClass = info.status === "online" ? "dot-online" : "dot-standby";
                bar.innerHTML += `
                    <div class="device-pill">
                        <span class="${dotClass}"></span>
                        <b>${device}:</b> 🔋 ${info.battery} | 📶 ${info.network} (${info.last_seen})
                    </div>`;
            }
        } catch (e) {}
    }
    fetchTelemetry();
    setInterval(fetchTelemetry, 15000);

    function appendMessage(role, content, meta = "") {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        if (role === "ai") {
            div.innerHTML = `<div class="msg-meta"><span>${meta}</span></div><div class="md-content">${marked.parse(content)}</div>`;
            div.querySelectorAll("pre").forEach(pre => {
                hljs.highlightElement(pre.querySelector("code"));
                const btn = document.createElement("button");
                btn.className = "copy-btn";
                btn.innerText = "Copy Code";
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.querySelector("code").innerText);
                    btn.innerText = "Copied ✓";
                    setTimeout(() => btn.innerText = "Copy Code", 2000);
                };
                pre.appendChild(btn);
            });
        } else {
            div.innerText = content;
        }
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    async function sendMessage(customText = null) {
        const text = customText || promptInput.value.trim();
        if (!text) return;

        if (!customText) promptInput.value = "";
        appendMessage("user", text);
        const loadingDiv = appendMessage("ai", "⏳ Processing on cloud...", "J.A.R.V.I.S. Thinking");

        const model = document.getElementById("model-select").value;
        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text, model: model, history: chatHistory })
            });
            const data = await res.json();
            loadingDiv.remove();

            if (data.error) {
                appendMessage("ai", `❌ ${data.error}`, "System Alert");
            } else {
                appendMessage("ai", data.reply, `${data.model_used} • ⚡ ${data.latency}`);
                chatHistory.push({ role: "user", content: text });
                chatHistory.push({ role: "assistant", content: data.reply });
            }
        } catch (err) {
            loadingDiv.remove();
            appendMessage("ai", "❌ Failed to reach server.", "Network Error");
        }
    }

    function continueCode() {
        sendMessage("Continue the code from the exact line you stopped at without repeating what was already written.");
    }

    function clearChat() {
        chatHistory = [];
        chatBox.innerHTML = "";
    }

    promptInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
